<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:metod = "post" th:action="@{/people/makeAdmin}">
    <label for="select">Choose person to make him admin</label>
    <br/>
    <select th:object = ${"person"} th:field = "*{id}" id="select">
        <option th:each="person : ${people}" th:value="${person.getId()}"
                th:text="${person.getName}"></option>
    </select>
    <input type="submit" value="Push me to make him admin"/>
</form>
</body>
</html>
